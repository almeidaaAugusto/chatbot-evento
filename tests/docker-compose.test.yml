# Ambiente ISOLADO de testes: n8n + Redis de verdade, com um WAHA simulado no lugar do real.
# Usa o mesmo workflow e o mesmo script de importação do ambiente real, mas com volumes,
# rede e credenciais próprios (valores fixos de teste, sem portas publicadas).
#
# Execute pela raiz do projeto:  powershell -ExecutionPolicy Bypass -File scripts\testar.ps1

name: chatbot-evento-teste

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:2.47.3
  env_file:
    - ../n8n/n8n.env
  networks:
    - teste

services:
  testes-locais:
    image: docker.n8n.io/n8nio/n8n:2.47.3
    entrypoint: ["node", "--test", "tests/conversa.test.js", "tests/ia.test.js", "tests/painel.test.js", "tests/workflow.test.js", "tests/eventos.test.js", "tests/painel-online.test.js", "tests/painel-online-whatsapp.test.js", "tests/painel-online-senha.test.js", "tests/banco-conexao.test.js", "tests/banco-ingestor.test.js", "tests/banco-servidor.test.js", "tests/segredos.test.js"]
    working_dir: /app
    volumes:
      - ../:/app:ro
    network_mode: none

  redis:
    image: redis:8-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --save '' --appendonly no"]
    environment:
      REDISCLI_AUTH: senha-de-teste
    networks:
      - teste
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Responde no mesmo endereço que o WAHA real (http://waha:3000) e também simula a API
  # de IA em http://waha:3000/ia/v1/chat/completions (ver "ia" em tests/config/chatbot.json).
  waha:
    image: docker.n8n.io/n8nio/n8n:2.47.3
    entrypoint: ["node", "/tests/mock-waha.js"]
    environment:
      MOCK_API_KEY: chave-de-teste
      MOCK_IA_KEY: chave-ia-de-teste
    volumes:
      - ./:/tests:ro
    networks:
      - teste
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  preparar-logs:
    image: redis:8-alpine
    restart: "no"
    user: "0"
    network_mode: none
    entrypoint: ["sh", "-c", "chown 1000:1000 /files/logs && chmod 750 /files/logs"]
    volumes:
      - logs:/files/logs

  n8n-init:
    <<: *n8n
    restart: "no"
    depends_on:
      preparar-logs:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/init/importar.sh"]
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENCRYPTION_KEY: chave-de-criptografia-de-teste
      WAHA_API_KEY: chave-de-teste
      WEBHOOK_TOKEN: token-de-teste
      REDIS_PASSWORD: senha-de-teste
      IA_API_KEY: chave-ia-de-teste
      CONVERSAS_RETENCAO_DIAS: 7
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/init:/init:ro
      - ../n8n/workflows:/workflows:ro
      - logs:/files/logs

  n8n:
    <<: *n8n
    depends_on:
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy
      n8n-init:
        condition: service_completed_successfully
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENCRYPTION_KEY: chave-de-criptografia-de-teste
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/files/config:ro
      - logs:/files/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # Painel lendo o mesmo volume de logs em que o n8n grava (página "Conversas").
  # Usa a MESMA imagem de produção (painel/Dockerfile); lib/ vem montada, como no ambiente real.
  # Sem banco e sem login: é o modo antigo, usado pelos testes de sempre.
  painel:
    build:
      context: ../painel
    image: chatbot-evento-painel:teste
    pull_policy: build
    depends_on:
      preparar-logs:
        condition: service_completed_successfully
    environment:
      TZ: America/Sao_Paulo
      PAINEL_HOST: 0.0.0.0
      PAINEL_PORT: 8080
      CHATBOT_CONFIG: /files/config/chatbot.json
      CHATBOT_LOGS: /files/logs
      CONVERSAS_RETENCAO_DIAS: 7
      WAHA_URL: http://waha:3000
    volumes:
      - ../lib:/app/lib:ro
      - ./config:/files/config:ro
      - logs:/files/logs
    networks:
      - teste
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ---------- Banco de dados (seção "Banco" do executar-testes.js) ----------

  # Postgres de teste: sem portas publicadas, dados só em memória.
  postgres:
    image: postgres:17-alpine
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: senha-do-banco-de-teste
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - teste
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Repassador TCP entre o painel e o Postgres: o teste o "desliga" para simular o banco fora do ar.
  proxy-banco:
    image: docker.n8n.io/n8nio/n8n:2.47.3
    entrypoint: ["node", "/tests/proxy-tcp.js"]
    environment:
      DESTINO: postgres:5432
      PORTA: 5432
      CONTROLE: 9000
    volumes:
      - ./:/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teste
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Cópia gravável da configuração para o painel com banco (o PUT /api/config grava aqui, sem
  # mexer no arquivo que o n8n lê).
  preparar-config-banco:
    image: redis:8-alpine
    restart: "no"
    user: "0"
    network_mode: none
    entrypoint: ["sh", "-c", "cp /origem/chatbot.json /destino/chatbot.json && chown -R 1000:1000 /destino"]
    volumes:
      - ./config:/origem:ro
      - config_banco:/destino

  # Painel COM banco e COM login (admin / senha-admin-teste-1, vindo de PAINEL_SENHA_HASH), ingerindo
  # os mesmos logs do n8n. Atrás do proxy-banco, para os testes de queda e volta do banco.
  painel-banco:
    build:
      context: ../painel
    image: chatbot-evento-painel:teste
    pull_policy: build
    depends_on:
      preparar-logs:
        condition: service_completed_successfully
      preparar-config-banco:
        condition: service_completed_successfully
      proxy-banco:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      PAINEL_HOST: 0.0.0.0
      PAINEL_PORT: 8080
      CHATBOT_CONFIG: /files/config/chatbot.json
      CHATBOT_LOGS: /files/logs
      CONVERSAS_RETENCAO_DIAS: 7
      WAHA_URL: http://waha:3000
      DATABASE_URL: postgres://chatbot:senha-do-banco-de-teste@proxy-banco:5432/chatbot
      PAINEL_USUARIO: admin
      PAINEL_SENHA_HASH: scrypt:16384:8:1:7b1238a4bb1d5fc0e20e32cbcb2a24e0:d1a798bef7e296a51fdb73d228654869252ffa8899161434973d1fd8668510310751d9c9ecff4facb7ce78fa2642939ce92f10a6bc6719f90ad0d66d223f1a5a
    volumes:
      - ../lib:/app/lib:ro
      - config_banco:/files/config
      - logs:/files/logs:ro
    networks:
      - teste
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10

  testes:
    image: docker.n8n.io/n8nio/n8n:2.47.3
    entrypoint: ["node", "/tests/executar-testes.js"]
    depends_on:
      n8n:
        condition: service_healthy
      painel:
        condition: service_healthy
      painel-banco:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      N8N_URL: http://n8n:5678
      WAHA_URL: http://waha:3000
      WEBHOOK_TOKEN: token-de-teste
      PAINEL_URL: http://painel:8080
      PAINEL_BANCO_URL: http://painel-banco:8080
      PROXY_BANCO_URL: http://proxy-banco:9000
      PAINEL_BANCO_USUARIO: admin
      PAINEL_BANCO_SENHA: senha-admin-teste-1
    volumes:
      - ./:/tests:ro
      # Regravável: os testes de vários eventos trocam o arquivo e depois o restauram.
      - ./config:/tests/config
      - logs:/logs:ro
      # Arquivo de configuração do painel com banco (conferir o que o PUT gravou).
      - config_banco:/config-banco
    networks:
      - teste

networks:
  teste: {}

volumes:
  n8n_data: {}
  logs: {}
  config_banco: {}
