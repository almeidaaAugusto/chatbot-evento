# Chatbot de evento: WhatsApp -> WAHA -> n8n -> WAHA -> WhatsApp
#
# Iniciar:  docker compose up -d
# Parar:    docker compose down          (os dados ficam nos volumes)
# Status:   docker compose ps
#
# Todas as credenciais vêm do arquivo .env (gere com scripts/gerar-env.ps1).
# WAHA, n8n e painel publicam portas somente em 127.0.0.1 (este computador).
# Painel online (só no servidor): COMPOSE_PROFILES=online no .env liga o serviço caddy, que abre
# as portas 80 e 443 com HTTPS na frente do painel. WAHA e n8n continuam fechados.

name: chatbot-evento

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:2.47.3
  env_file:
    - ./n8n/n8n.env
  networks:
    - chatbot
  logging: *logging

services:
  # Estado do chatbot: deduplicação, limites de resposta e contatos em atendimento humano.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --save 60 1"]
    environment:
      # redis-cli lê a senha desta variável (usada no healthcheck e nos scripts).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env (rode scripts/gerar-env.ps1)}
    volumes:
      - redis_data:/data
    networks:
      - chatbot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging

  # Entrega o volume de logs ao usuário do n8n (uid 1000). Termina em menos de 1 segundo.
  preparar-logs:
    image: redis:8-alpine
    restart: "no"
    user: "0"
    network_mode: none
    entrypoint: ["sh", "-c", "chown 1000:1000 /files/logs && chmod 750 /files/logs"]
    volumes:
      - logs:/files/logs
    logging: *logging

  # Roda uma vez antes do n8n: importa credenciais e workflows na primeira subida.
  n8n-init:
    <<: *n8n
    restart: "no"
    depends_on:
      preparar-logs:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/init/importar.sh"]
    environment:
      GENERIC_TIMEZONE: ${FUSO_HORARIO:-America/Sao_Paulo}
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY no .env}
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no .env}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Defina WEBHOOK_TOKEN no .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Opcional: chave da API de IA (scripts/configurar-ia.ps1). Vazia = IA sem chave.
      IA_API_KEY: ${IA_API_KEY:-}
      IMPORTAR: ${IMPORTAR:-auto}
      LOG_RETENCAO_DIAS: ${LOG_RETENCAO_DIAS:-30}
      CONVERSAS_RETENCAO_DIAS: ${CONVERSAS_RETENCAO_DIAS:-7}
      CHATBOT_CONFIG_LIB: /app/lib/configuracao.js
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/init:/init:ro
      - ./n8n/workflows:/workflows:ro
      - ./lib:/app/lib:ro
      - ./config:/files/config:ro
      - logs:/files/logs

  n8n:
    <<: *n8n
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      n8n-init:
        condition: service_completed_successfully
    environment:
      GENERIC_TIMEZONE: ${FUSO_HORARIO:-America/Sao_Paulo}
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/files/config:ro
      - logs:/files/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Banco de dados: histórico de conversas, versões da configuração e usuários do painel.
  # Sem portas publicadas (só a rede interna do Docker). O bot não depende dele.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?Defina POSTGRES_SENHA no .env (rode scripts/gerar-env.ps1)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *logging

  # Backup diário do banco às 04:00 (fuso FUSO_HORARIO): pg_dump -Fc em /backups, mantendo os 14 mais recentes.
  # Restaurar: veja docs/vps-oracle.md. O $$ evita que o compose interprete as variáveis do shell.
  backup-banco:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      PGPASSWORD: ${POSTGRES_SENHA:?Defina POSTGRES_SENHA no .env (rode scripts/gerar-env.ps1)}
    entrypoint:
      - sh
      - -c
      - |
        # A imagem alpine pode não ter os fusos horários; tenta instalar (sem internet, segue em UTC).
        [ -e "/usr/share/zoneinfo/$$TZ" ] || apk add --no-cache tzdata >/dev/null 2>&1 || true
        echo "backup-banco: dump diário às 04:00 ($$TZ), mantendo os 14 mais recentes"
        while true; do
          h=$$(date +%H); m=$$(date +%M); s=$$(date +%S)
          h=$${h#0}; m=$${m#0}; s=$${s#0}
          espera=$$(( 4*3600 - (h*3600 + m*60 + s) ))
          [ "$$espera" -le 0 ] && espera=$$(( espera + 86400 ))
          sleep "$$espera"
          arq=/backups/chatbot-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -Fc -h postgres -U chatbot chatbot > "$$arq.tmp"; then
            mv "$$arq.tmp" "$$arq"
            echo "backup-banco: gravado $$arq"
            ls -1t /backups/chatbot-*.dump | tail -n +15 | xargs -r rm -f
          else
            rm -f "$$arq.tmp"
            echo "backup-banco: FALHOU o pg_dump" >&2
          fi
          sleep 60
        done
    volumes:
      - backups_banco:/backups
    networks:
      - chatbot
    logging: *logging

  # Edição dos textos, simulação local, acompanhamento das conversas e controle dos números de
  # WhatsApp (ligar, parar, QR Code, desconectar). Por isso recebe a chave da API do WAHA
  # (WAHA_API_KEY), além da chave da IA: quem entra no painel controla o WhatsApp. Com domínio
  # configurado, o painel só sobe com login (PAINEL_SENHA_HASH). Lê o volume de logs (conversas
  # e erros), apagando conversas antigas.
  painel:
    # Imagem própria (painel/Dockerfile): o código vai dentro da imagem, então o
    # scripts\vps.ps1 -Enviar reconstrói com "docker compose up -d --build".
    build:
      context: ./painel
    image: chatbot-evento-painel:local
    restart: unless-stopped
    # Sem depends_on do postgres de propósito: o painel sobe mesmo sem banco e reconecta sozinho.
    depends_on:
      preparar-logs:
        condition: service_completed_successfully
    environment:
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      PAINEL_HOST: 0.0.0.0
      PAINEL_PORT: 8080
      PAINEL_PUBLIC_PORT: ${PAINEL_PORT:-8080}
      CHATBOT_CONFIG: /files/config/chatbot.json
      IA_API_KEY: ${IA_API_KEY:-}
      CHATBOT_LOGS: /files/logs
      CONVERSAS_RETENCAO_DIAS: ${CONVERSAS_RETENCAO_DIAS:-7}
      # Banco (histórico, versões da configuração, usuários). Só na rede interna; sem porta publicada.
      DATABASE_URL: postgres://chatbot:${POSTGRES_SENHA:?Defina POSTGRES_SENHA no .env (rode scripts/gerar-env.ps1)}@postgres:5432/chatbot
      HISTORICO_RETENCAO_DIAS: ${HISTORICO_RETENCAO_DIAS:-180}
      # WAHA: /ping (situação) e a API de sessões (números, QR Code), com a chave abaixo.
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no .env}
      # n8n: só /healthz, para mostrar a situação do servidor.
      N8N_URL: http://n8n:5678
      # Acesso pela internet (veja docs/vps-oracle.md). Vazios no PC: painel só em localhost, sem login.
      PAINEL_DOMINIO: ${PAINEL_DOMINIO:-}
      PAINEL_USUARIO: ${PAINEL_USUARIO:-admin}
      PAINEL_SENHA_HASH: ${PAINEL_SENHA_HASH:-}
      # true só atrás do Caddy: aí o IP do visitante vem do cabeçalho X-Forwarded-For.
      PAINEL_CONFIAR_PROXY: ${PAINEL_CONFIAR_PROXY:-false}
    ports:
      - "127.0.0.1:${PAINEL_PORT:-8080}:8080"
    volumes:
      - ./lib:/app/lib:ro
      - ./config:/files/config
      - logs:/files/logs
    networks:
      - chatbot
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  # HTTPS na frente do painel (certificado Let's Encrypt automático). Só sobe com
  # COMPOSE_PROFILES=online no .env do servidor (scripts\vps.ps1 -Online). Não sobe no PC.
  # Tag 2.10-alpine: série 2.x estável, imagem multi-arquitetura (amd64 e arm64).
  caddy:
    image: caddy:2.10-alpine
    profiles: ["online"]
    restart: unless-stopped
    depends_on:
      painel:
        condition: service_healthy
    environment:
      PAINEL_DOMINIO: ${PAINEL_DOMINIO:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - chatbot
    logging: *logging

  waha:
    image: devlikeapro/waha:${WAHA_IMAGEM:-gows-2026.10.1}
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      # Engine sem navegador (mais leve). Documentação: https://waha.devlike.pro/docs/how-to/engines/
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_NAMESPACE: all
      WAHA_WORKER_ID: chatbot-evento
      # A API só guarda o hash SHA-512 da chave; a chave em texto fica no .env e no n8n.
      WAHA_API_KEY: sha512:${WAHA_API_KEY_SHA512:?Defina WAHA_API_KEY_SHA512 no .env}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?Defina WAHA_DASHBOARD_USERNAME no .env}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Defina WAHA_DASHBOARD_PASSWORD no .env}
      WHATSAPP_SWAGGER_ENABLED: "true"
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      # Webhook global: toda sessão entrega os eventos ao n8n pela rede interna.
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/waha-evento
      WHATSAPP_HOOK_EVENTS: message.any,session.status
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Webhook-Token:${WEBHOOK_TOKEN}
      WHATSAPP_HOOK_RETRIES_POLICY: exponential
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: "4"
      # O chatbot só atende conversas individuais.
      WAHA_SESSION_CONFIG_IGNORE_STATUS: "true"
      WAHA_SESSION_CONFIG_IGNORE_GROUPS: "true"
      WAHA_SESSION_CONFIG_IGNORE_CHANNELS: "true"
      WAHA_SESSION_CONFIG_IGNORE_BROADCAST: "true"
      # Não baixa fotos/áudios recebidos e não imprime o QR Code nos logs.
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"
      WAHA_PRINT_QR: "False"
      WAHA_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - chatbot
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging: *logging

networks:
  chatbot:
    name: chatbot-evento

volumes:
  redis_data:
  n8n_data:
  # Banco do painel (histórico, versões da configuração, usuários) e seus dumps diários.
  postgres_data:
  backups_banco:
  waha_sessions:
  # Logs de diagnóstico. Veja com scripts/ver-logs.ps1 (a pasta logs/ do projeto recebe as exportações).
  logs:
  # Certificados HTTPS do Caddy (perdê-lo força emitir de novo; há limite de emissões por semana).
  caddy_data:
  caddy_config:
